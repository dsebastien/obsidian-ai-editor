name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    ci:
        runs-on: ubuntu-slim

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: package.json

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Type check
              run: bun run tsc

            - name: Lint
              run: bun run lint

            # The rule floor. A pre-commit hook is advisory — `--no-verify`, a
            # commit from another machine, or any tool that writes commits
            # directly all walk past it. This step is where the floor is
            # actually enforced: it fails if the RESOLVED eslint/tsc config is
            # weaker than rules-baseline.json.
            - name: Rule floor
              run: bun run rules:check

            - name: Test
              run: bun test

            - name: Format check
              run: bun run format:check
